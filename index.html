<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hound Hub</title>
    <link href="/style.css" rel="stylesheet" type="text/css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
</head>
<body>

    <!--  -->

    <div id="searchContainer">
        <h1 id="title">COBBLEVERSE POKEMON <span>&nbsp;SEARCHER</span></h1>

        <div class="searchBox">
            <input type="text" id="textSearch" name="fname" placeholder="Enter Pokemon name...">
            <button type="button" id="submitSearch">Submit</button>
        </div>
    </div>


    <!--  -->


    <div id="image">
        <img id="mainImage" src="" alt="Pokemon Image">
    </div>

    <div id="infoContainer">

        <div class="column">
            <h1 name="pack" class="infoText">Pack:</h1>
            <h1 name="spawn" class="infoText">Spawn:</h1>
            <h1 name="rarity" class="infoText">Rarity:</h1>
            <h1 name="classification" class="infoText">Classification:</h1>
            <h1 name="condition" class="infoText">Condition:</h1>
        </div>

        <div class="column">
            <h1 name="time" class="infoText">Time:</h1>
            <h1 name="weather" class="infoText">Weather:</h1>
            <h1 name="context" class="infoText">Context:</h1>
            <h1 name="forms" class="infoText">Forms:</h1>
            <h1 name="types" class="infoText">Types:</h1>
        </div>

        <!--  -->

    </div>

    <a href="https://www.termsfeed.com/live/0cb4e3a8-71d4-45cd-83bb-3238b2d87b7c" target="_blank">
        <h1 id="privacy">Terms Of Service</h1>
    </a>

    <script src="index.js"></script>
</body>
</html>
